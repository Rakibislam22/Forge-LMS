<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge · Lecture (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #C2410C;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow-y:auto;background:#F6F4EF;font-family:Inter,system-ui,sans-serif;color:#15171C">
  <header style="position:sticky;top:0;z-index:2;background:#FFFFFF;border-bottom:1px solid #E2DED5;padding:0 8px;min-height:60px;display:flex;align-items:center">
    <a href="Mobile-Detail.dc.html" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;font-weight:600;font-size:15px">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3 5 9l6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>MERN course
    </a>
  </header>
  <main style="display:flex;flex-direction:column">
    <div style="position:relative;aspect-ratio:16/9;background:#15171C;overflow:hidden;display:flex;align-items:center;justify-content:center">
      <div style="position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:#1F2530"></div>
      <span style="position:relative;width:60px;height:60px;border-radius:50%;background:#C2410C;display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" fill="#FFFFFF"></path></svg>
      </span>
    </div>
    <div style="padding:20px 16px;display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:600;color:#C2410C">Lecture 1 of 6</span>
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:26px;line-height:1.1">Course introduction and setup</h1>
      <p style="margin:0;font-size:15px;line-height:1.55;color:#5B606B">What we build, the tools you need and how the project is organised.</p>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px">
        <a href="Mobile-Lecture.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #15171C;border-radius:10px;background:#FFFFFF;font-weight:600;font-size:15px">← Previous</a>
        <a href="Mobile-Lecture.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:#15171C;color:#FFFFFF;font-weight:600;font-size:15px">Next →</a>
      </div>
    </div>
    <section style="background:#FFFFFF;border-top:1px solid #E2DED5">
      <h2 style="margin:0;padding:16px;font-family:'Space Grotesk',sans-serif;font-size:18px;border-bottom:1px solid #E2DED5">Course lectures</h2>
      <ol style="list-style:none;margin:0;padding:0">
        <sc-for list="{{lectures}}" as="l" hint-placeholder-count="6">
          <li style="border-bottom:1px solid #E2DED5">
            <a href="Mobile-Lecture.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:44px;background:{{l.bg}}">
              <span style="flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;background:{{l.badgeBg}};color:{{l.badgeFg}}">{{l.n}}</span>
              <span style="font-size:14.5px;font-weight:{{l.weight}};line-height:1.3">{{l.title}}</span>
            </a>
          </li>
        </sc-for>
      </ol>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = ['Course introduction and setup','Project structure with MVC','Building the Express API','Connecting MongoDB with Mongoose','Admin authentication with JWT','The React frontend'];
    return { lectures: t.map((title, k) => ({
      n: k + 1, title,
      bg: k === 0 ? '#FBE9DF' : '#FFFFFF',
      badgeBg: k === 0 ? '#C2410C' : '#F6F4EF',
      badgeFg: k === 0 ? '#FFFFFF' : '#15171C',
      weight: k === 0 ? 600 : 500
    })) };
  }
}
</script>
</body>
</html>
