<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge · Course details (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #C2410C;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow-y:auto;background:#F6F4EF;font-family:Inter,system-ui,sans-serif;color:#15171C">
  <header style="position:sticky;top:0;z-index:2;background:#FFFFFF;border-bottom:1px solid #E2DED5;padding:0 8px;min-height:60px;display:flex;align-items:center;justify-content:space-between">
    <a href="Mobile-Courses.dc.html" aria-label="Back to courses" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;font-weight:600;font-size:15px">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3 5 9l6 6" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Courses
    </a>
    <a href="Admin-Login.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-weight:600;font-size:14px;color:#5B606B">Admin</a>
  </header>
  <main style="display:flex;flex-direction:column">
    <div style="position:relative;height:200px;overflow:hidden;background:#1F3A5F">
      <div style="position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:#2E5283"></div>
      <div style="position:absolute;left:20px;bottom:22px;width:64px;height:8px;border-radius:4px;background:#2E5283"></div>
      <div style="position:absolute;left:20px;top:18px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:48px;letter-spacing:-0.03em;color:#FFFFFF">MERN</div>
    </div>
    <div style="padding:22px 16px 28px;display:flex;flex-direction:column;gap:14px">
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:28px;line-height:1.1;letter-spacing:-0.01em">Full-Stack Web Development with MERN</h1>
      <p style="margin:0;font-size:15.5px;line-height:1.55;color:#5B606B">Build and ship a complete app with MongoDB, Express, React and Node.js, from the database schema to the deployed frontend.</p>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px">$49</span>
        <a href="Mobile-Lecture.dc.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;background:#C2410C;color:#FFFFFF;font-weight:600;font-size:15px">Start first lecture</a>
      </div>
    </div>
    <section style="background:#FFFFFF;border-top:1px solid #E2DED5">
      <div style="padding:18px 16px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #E2DED5">
        <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:20px">Lectures</h2>
        <span style="font-size:13px;color:#5B606B">6 lectures</span>
      </div>
      <ol style="list-style:none;margin:0;padding:0">
        <sc-for list="{{lectures}}" as="l" hint-placeholder-count="6">
          <li style="border-bottom:1px solid #E2DED5">
            <a href="Mobile-Lecture.dc.html" style="display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:44px">
              <span style="flex:none;width:34px;height:34px;border-radius:50%;background:#F6F4EF;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px">{{l.n}}</span>
              <span style="flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.3">{{l.title}}</span>
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex:none"><path d="M4 2.5v11l9-5.5z" fill="#C2410C"></path></svg>
            </a>
          </li>
        </sc-for>
      </ol>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { lectures: [
      { n:1, title:'Course introduction and setup' },
      { n:2, title:'Project structure with MVC' },
      { n:3, title:'Building the Express API' },
      { n:4, title:'Connecting MongoDB with Mongoose' },
      { n:5, title:'Admin authentication with JWT' },
      { n:6, title:'The React frontend' }
    ] };
  }
}
</script>
</body>
</html>
