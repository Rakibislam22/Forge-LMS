<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge · Admin login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #C2410C;outline-offset:2px}
input{font:400 16px Inter,sans-serif}
</style>
</helmet>
<div style="font-family:Inter,system-ui,sans-serif;color:#15171C;background:#F6F4EF;min-height:760px;display:flex;flex-wrap:wrap">
  <section style="flex:1 1 420px;min-width:0;background:#15171C;color:#FFFFFF;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:48px;position:relative;overflow:hidden">
    <div style="position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:#1F2530"></div>
    <a href="Main.dc.html" style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#F6F4EF"></rect><path d="M8 20V8h12v4h-8v2h6v4h-6v2z" fill="#15171C"></path></svg>Forge
    </a>
    <div style="position:relative;display:flex;flex-direction:column;gap:14px;max-width:420px">
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:44px;line-height:1.05;letter-spacing:-0.02em">Admin dashboard</h1>
      <p style="margin:0;font-size:17px;line-height:1.55;color:#C9CDD6">Sign in to create courses and manage their lectures.</p>
    </div>
  </section>

  <section style="flex:1 1 420px;min-width:0;padding:48px 24px;display:flex;align-items:center;justify-content:center">
    <form style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px" onsubmit="return false">
      <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:30px">Sign in</h2>
      <div role="alert" style="display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #B42318;border-radius:10px;background:#FFFFFF;color:#B42318;font-size:14px;line-height:1.4">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="9" cy="9" r="8" fill="none" stroke="#B42318" stroke-width="1.6"></circle><path d="M9 5v5" stroke="#B42318" stroke-width="1.6" stroke-linecap="round"></path><circle cx="9" cy="12.5" r="1" fill="#B42318"></circle></svg>
        Incorrect email or password. Try again.
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="email" style="font-size:14px;font-weight:600">Email</label>
        <input id="email" type="email" value="admin@example.com" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:1px solid #9A9588;border-radius:10px;background:#FFFFFF;color:#15171C">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="pw" style="font-size:14px;font-weight:600">Password</label>
        <input id="pw" type="password" value="password" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:1px solid #B42318;border-radius:10px;background:#FFFFFF;color:#15171C">
      </div>
      <a href="Admin-Courses.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:10px;background:#C2410C;color:#FFFFFF;font-weight:600;font-size:16px">Sign in</a>
      <a href="Main.dc.html" style="font-size:14px;color:#5B606B;text-decoration:underline;align-self:flex-start;padding:10px 0">← Back to courses</a>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
