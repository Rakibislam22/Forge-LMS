<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge · Courses (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #C2410C;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow-y:auto;background:#F6F4EF;font-family:Inter,system-ui,sans-serif;color:#15171C">
  <header style="position:sticky;top:0;z-index:2;background:#FFFFFF;border-bottom:1px solid #E2DED5;padding:0 16px;min-height:60px;display:flex;align-items:center;justify-content:space-between">
    <a href="Mobile-Courses.dc.html" style="display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px">
      <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#15171C"></rect><path d="M8 20V8h12v4h-8v2h6v4h-6v2z" fill="#F6F4EF"></path></svg>Forge
    </a>
    <a href="Admin-Login.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #15171C;border-radius:8px;font-weight:600;font-size:14px">Admin</a>
  </header>
  <main style="padding:24px 16px 32px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.05;letter-spacing:-0.02em">All courses</h1>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#5B606B">Pick a course and start watching. No sign-up needed.</p>
    </div>
    <sc-for list="{{courses}}" as="c" hint-placeholder-count="3">
      <a href="Mobile-Detail.dc.html" style="display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E2DED5;border-radius:14px;overflow:hidden">
        <div style="position:relative;height:140px;overflow:hidden;background:{{c.bg}}">
          <div style="position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:{{c.shape}}"></div>
          <div style="position:absolute;left:18px;bottom:18px;width:52px;height:7px;border-radius:4px;background:{{c.shape}}"></div>
          <div style="position:absolute;left:18px;top:14px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;letter-spacing:-0.02em;color:{{c.fg}}">{{c.tag}}</div>
        </div>
        <div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px">
          <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:19px;line-height:1.2">{{c.title}}</h2>
          <p style="margin:0;font-size:14.5px;line-height:1.5;color:#5B606B;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">{{c.desc}}</p>
          <div style="display:flex;align-items:center;justify-content:space-between;padding-top:6px">
            <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px">{{c.price}}</span>
            <span style="font-size:14px;font-weight:600;color:#C2410C">View course →</span>
          </div>
        </div>
      </a>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { courses: [
      { tag:'MERN', bg:'#1F3A5F', fg:'#FFFFFF', shape:'#2E5283', title:'Full-Stack Web Development with MERN', desc:'Build and ship a complete app with MongoDB, Express, React and Node.js, from the database schema to the deployed frontend.', price:'$49' },
      { tag:'TS', bg:'#C2410C', fg:'#FFFFFF', shape:'#A8370A', title:'TypeScript from Zero to Confident', desc:'Types, generics and narrowing explained through small, practical exercises you can apply to any JavaScript codebase.', price:'$29' },
      { tag:'API', bg:'#2F6F5E', fg:'#FFFFFF', shape:'#3F8A75', title:'REST API Design with Express', desc:'Structure routes, controllers and models using MVC, validate input and handle errors the way production APIs do.', price:'$34' }
    ] };
  }
}
</script>
</body>
</html>
