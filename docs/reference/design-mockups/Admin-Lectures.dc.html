<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge · Admin lectures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #C2410C;outline-offset:2px}
input,textarea{font:400 16px Inter,sans-serif}
.side:hover{background:#242932}
.act:hover{background:#F6F4EF}
</style>
</helmet>
<div style="font-family:Inter,system-ui,sans-serif;color:#15171C;background:#F6F4EF;min-height:1000px;display:flex;flex-wrap:wrap">
  <aside style="flex:0 0 240px;flex-grow:1;max-width:100%;min-width:200px;background:#15171C;color:#FFFFFF;padding:24px 16px;display:flex;flex-direction:column;gap:28px;box-sizing:border-box">
    <a href="Admin-Courses.dc.html" style="display:flex;align-items:center;gap:10px;padding:0 8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px">
      <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#F6F4EF"></rect><path d="M8 20V8h12v4h-8v2h6v4h-6v2z" fill="#15171C"></path></svg>Forge <span style="font-size:12px;font-weight:500;color:#C9CDD6;font-family:Inter,sans-serif">Admin</span>
    </a>
    <nav style="display:flex;flex-direction:column;gap:4px">
      <a href="Admin-Courses.dc.html" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;background:#C2410C;font-weight:600;font-size:15px">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.6"></rect><path d="M2 7h14" stroke="#FFFFFF" stroke-width="1.6"></path></svg>Courses
      </a>
      <a class="side" href="Main.dc.html" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;font-size:15px;color:#E4E6EB">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3H3v12h12v-4M10 3h5v5M15 3 8 10" fill="none" stroke="#E4E6EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>View student site
      </a>
    </nav>
    <a class="side" href="Admin-Login.dc.html" style="margin-top:auto;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;font-size:15px;color:#E4E6EB">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3H3v12h4M12 5l4 4-4 4M16 9H7" fill="none" stroke="#E4E6EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Log out
    </a>
  </aside>

  <main style="flex:999 1 640px;min-width:0;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <a href="Admin-Courses.dc.html" style="font-size:14px;color:#5B606B;text-decoration:underline;align-self:flex-start;padding:8px 0">← Back to courses</a>
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:36px;line-height:1.1;letter-spacing:-0.02em">Lectures</h1>
      <p style="margin:0;font-size:15px;color:#5B606B">Full-Stack Web Development with MERN · 6 lectures</p>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
      <section style="flex:999 1 460px;min-width:0;background:#FFFFFF;border:1px solid #E2DED5;border-radius:14px;overflow:hidden">
        <ol style="list-style:none;margin:0;padding:0">
          <sc-for list="{{lectures}}" as="l" hint-placeholder-count="6">
            <li style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 24px;border-bottom:1px solid #E2DED5">
              <span style="flex:none;width:36px;height:36px;border-radius:50%;background:#F6F4EF;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px">{{l.n}}</span>
              <div style="flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px">
                <span style="font-weight:600;font-size:15.5px">{{l.title}}</span>
                <span style="font-size:13px;color:#5B606B;overflow-wrap:anywhere">{{l.url}}</span>
              </div>
              <div style="display:flex;gap:4px">
                <a class="act" href="Admin-Lectures.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;font-weight:600;font-size:14px">Edit</a>
                <a class="act" href="Admin-Lectures.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;font-weight:600;font-size:14px;color:#B42318">Delete</a>
              </div>
            </li>
          </sc-for>
        </ol>
      </section>

      <form onsubmit="return false" style="flex:1 1 320px;min-width:0;background:#FFFFFF;border:1px solid #E2DED5;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px">
        <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:22px">Add lecture</h2>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="lt" style="font-size:14px;font-weight:600">Title</label>
          <input id="lt" type="text" placeholder="Lecture title" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:1px solid #9A9588;border-radius:10px;background:#FFFFFF;color:#15171C">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="ld" style="font-size:14px;font-weight:600">Description</label>
          <textarea id="ld" rows="4" placeholder="What this lecture covers" style="box-sizing:border-box;width:100%;padding:12px 14px;border:1px solid #9A9588;border-radius:10px;background:#FFFFFF;color:#15171C;line-height:1.5;resize:vertical"></textarea>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="lu" style="font-size:14px;font-weight:600">Video URL</label>
          <input id="lu" type="url" placeholder="https://www.youtube.com/embed/…" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:1px solid #9A9588;border-radius:10px;background:#FFFFFF;color:#15171C">
          <span style="font-size:13px;color:#5B606B">Use an embeddable video link.</span>
        </div>
        <button type="submit" style="min-height:48px;border:0;border-radius:10px;background:#C2410C;color:#FFFFFF;font:600 16px Inter,sans-serif;cursor:pointer">Add lecture</button>
      </form>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const t = ['Course introduction and setup','Project structure with MVC','Building the Express API','Connecting MongoDB with Mongoose','Admin authentication with JWT','The React frontend'];
    return { lectures: t.map((title, k) => ({ n: k + 1, title, url: 'https://www.youtube.com/embed/[VIDEO_ID]' })) };
  }
}
</script>
</body>
</html>
