<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge · Admin course form</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #C2410C;outline-offset:2px}
input,textarea{font:400 16px Inter,sans-serif}
.side:hover{background:#242932}
</style>
</helmet>
<div style="font-family:Inter,system-ui,sans-serif;color:#15171C;background:#F6F4EF;min-height:900px;display:flex;flex-wrap:wrap">
  <aside style="flex:0 0 240px;flex-grow:1;max-width:100%;min-width:200px;background:#15171C;color:#FFFFFF;padding:24px 16px;display:flex;flex-direction:column;gap:28px;box-sizing:border-box">
    <a href="Admin-Courses.dc.html" style="display:flex;align-items:center;gap:10px;padding:0 8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px">
      <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#F6F4EF"></rect><path d="M8 20V8h12v4h-8v2h6v4h-6v2z" fill="#15171C"></path></svg>Forge <span style="font-size:12px;font-weight:500;color:#C9CDD6;font-family:Inter,sans-serif">Admin</span>
    </a>
    <nav style="display:flex;flex-direction:column;gap:4px">
      <a href="Admin-Courses.dc.html" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;background:#C2410C;font-weight:600;font-size:15px">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.6"></rect><path d="M2 7h14" stroke="#FFFFFF" stroke-width="1.6"></path></svg>Courses
      </a>
      <a class="side" href="Main.dc.html" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;font-size:15px;color:#E4E6EB">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3H3v12h12v-4M10 3h5v5M15 3 8 10" fill="none" stroke="#E4E6EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>View student site
      </a>
    </nav>
    <a class="side" href="Admin-Login.dc.html" style="margin-top:auto;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;font-size:15px;color:#E4E6EB">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3H3v12h4M12 5l4 4-4 4M16 9H7" fill="none" stroke="#E4E6EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Log out
    </a>
  </aside>

  <main style="flex:999 1 640px;min-width:0;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <a href="Admin-Courses.dc.html" style="font-size:14px;color:#5B606B;text-decoration:underline;align-self:flex-start;padding:8px 0">← Back to courses</a>
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:36px;letter-spacing:-0.02em">Edit course</h1>
    </div>

    <form onsubmit="return false" style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
      <div style="flex:999 1 460px;min-width:0;background:#FFFFFF;border:1px solid #E2DED5;border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="title" style="font-size:14px;font-weight:600">Title</label>
          <input id="title" type="text" value="Full-Stack Web Development with MERN" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:1px solid #9A9588;border-radius:10px;background:#FFFFFF;color:#15171C">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="desc" style="font-size:14px;font-weight:600">Description</label>
          <textarea id="desc" rows="5" style="box-sizing:border-box;width:100%;padding:12px 14px;border:1px solid #9A9588;border-radius:10px;background:#FFFFFF;color:#15171C;line-height:1.5;resize:vertical">Build and ship a complete app with MongoDB, Express, React and Node.js, from the database schema to the deployed frontend.</textarea>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:22px">
          <div style="flex:1 1 160px;display:flex;flex-direction:column;gap:6px">
            <label for="price" style="font-size:14px;font-weight:600">Price (USD)</label>
            <input id="price" type="text" inputmode="decimal" value="-49" aria-invalid="true" aria-describedby="priceerr" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:2px solid #B42318;border-radius:10px;background:#FFFFFF;color:#15171C">
            <span id="priceerr" role="alert" style="font-size:13px;color:#B42318">Price must be 0 or more.</span>
          </div>
          <div style="flex:2 1 280px;display:flex;flex-direction:column;gap:6px">
            <label for="thumb" style="font-size:14px;font-weight:600">Thumbnail URL</label>
            <input id="thumb" type="url" value="https://example.com/images/mern.jpg" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border:1px solid #9A9588;border-radius:10px;background:#FFFFFF;color:#15171C">
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding-top:8px;border-top:1px solid #E2DED5;margin-top:4px">
          <a href="Admin-Courses.dc.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid #15171C;border-radius:10px;background:#FFFFFF;font-weight:600;font-size:15px">Cancel</a>
          <a href="Admin-Courses.dc.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:10px;background:#C2410C;color:#FFFFFF;font-weight:600;font-size:15px">Save course</a>
        </div>
      </div>

      <aside style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:12px">
        <span style="font-size:14px;font-weight:600">Thumbnail preview</span>
        <div style="position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#1F3A5F">
          <div style="position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:#2E5283"></div>
          <div style="position:absolute;left:24px;top:20px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;letter-spacing:-0.02em;color:#FFFFFF">MERN</div>
        </div>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#5B606B">Shows how the course card will look to students. Use a direct image link.</p>
      </aside>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
